<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint not found — Faisal Razi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#0B1D33; --line:#2BB3C0; --glow:#7CF5FF; --amber:#FFB547; --fg:#E8F1FB; --muted:#8BA3BF; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --ink:#F4F1EA; --line:#137F8A; --glow:#0E9AA8; --amber:#C97A00; --fg:#0B1D33; --muted:#5B7593; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:16px; background: var(--ink); color: var(--fg); font: 16px/1.6 system-ui, sans-serif;
    background-image: linear-gradient(rgba(43,179,192,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(43,179,192,.14) 1px, transparent 1px), linear-gradient(rgba(43,179,192,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(43,179,192,.06) 1px, transparent 1px);
    background-size: 120px 120px,120px 120px,24px 24px,24px 24px; }
  .sheet { position:relative; max-width:560px; width:100%; padding:40px; border:1.5px dashed var(--line); }
  .code { font: 800 clamp(5rem,22vw,9rem)/.9 system-ui, sans-serif; letter-spacing:-.06em; color:transparent; -webkit-text-stroke: 1.5px var(--line); }
  .mono { font: 500 12px ui-monospace, Consolas, monospace; letter-spacing:.14em; color: var(--line); text-transform: uppercase; }
  h1 { font-size: clamp(1.5rem,5vw,2.2rem); margin:.4em 0 .3em; letter-spacing:-.02em; }
  p { color: var(--muted); margin:0 0 28px; }
  a { display:inline-block; padding:14px 24px; border-radius:999px; background: var(--amber); color:#0B1D33; font-weight:700; text-decoration:none; }
  .dim { position:absolute; top:-22px; left:0; right:0; text-align:center; } .x { position:absolute; inset:0; pointer-events:none; opacity:.12; }
</style>
</head>
<body>
  <main class="sheet">
    <span class="mono dim">← 404 px →</span>
    <p class="mono">// SHEET MISSING FROM THE SET</p>
    <div class="code" aria-hidden="true">404</div>
    <h1>Blueprint not found.</h1>
    <p>This drawing was never filed, or it moved to another cabinet.</p>
    <a id="home" href="/">Back to the main sheet →</a>
  </main>
</body>
</html>
